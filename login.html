<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In | Troca de Livros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page" data-page="login">

  <main class="auth">
    <section class="auth-card" aria-labelledby="titulo">
      <h1 id="titulo">Log In</h1>
      <p class="auth-lead">Entre com o seu e-mail da escola e a sua senha.</p>

      <form id="form-login" novalidate>

        <div class="field">
          <label for="email">E-mail da escola</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false"
                   placeholder="nome.sobrenome@alunos.g12.br" aria-describedby="email-erro" required>
          </div>
          <p class="field__error" id="email-erro" role="alert"></p>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="senha" name="senha" type="password" autocomplete="current-password"
                   placeholder="Digite a sua senha" aria-describedby="senha-erro" required>
            <button class="toggle-senha" type="button" data-alvo="senha" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field__error" id="senha-erro" role="alert"></p>
        </div>

        <p class="auth-forgot"><a href="esqueci-senha.html" id="link-esqueci">Esqueci minha senha</a></p>

        <button class="btn-gradient" type="submit">Entrar</button>
      </form>

      <!-- Aparece depois de um login válido: por enquanto não existe página depois do login -->
      <div class="test-box test-box--login" id="aviso-teste" role="status" hidden>
        <strong>Modo de teste.</strong> Login simulado: nenhuma senha foi conferida e ainda não existe
        uma página depois do login.
      </div>

      <p class="auth-switch">Não tem conta? <a href="cadastro.html">Sign up</a></p>
    </section>

    <a class="auth-back" href="index.html">&larr; Voltar ao início</a>
  </main>

  <script src="js/auth.js"></script>
  <!-- DEV: atalhos de teste. Remover estas 2 linhas (e js/config.js, js/dev-atalhos.js) antes da versão final -->
  <script src="js/config.js"></script>
  <script src="js/dev-atalhos.js"></script>
</body>
</html>

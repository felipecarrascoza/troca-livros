<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar nova senha | Troca de Livros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page" data-page="redefinir">

  <!-- Página aberta pelo link do e-mail. No site de verdade, o link terá um código
       secreto que vence depois de um tempo; aqui o botão de teste faz esse papel. -->
  <main class="auth">
    <section class="auth-card" aria-labelledby="titulo">
      <h1 id="titulo">Criar nova senha</h1>
      <p class="auth-lead" id="lead">Escolha uma senha nova para a sua conta.</p>

      <form id="form-redefinir" novalidate>
        <div class="field">
          <label for="senha">Nova senha</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="senha" name="senha" type="password" autocomplete="new-password"
                   placeholder="Crie uma senha" aria-describedby="senha-dica senha-erro" required>
            <button class="toggle-senha" type="button" data-alvo="senha" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field__hint" id="senha-dica">Mínimo de 8 caracteres, com letras e números.</p>
          <p class="field__error" id="senha-erro" role="alert"></p>
        </div>

        <div class="field">
          <label for="senha2">Confirmar nova senha</label>
          <div class="field__control">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input id="senha2" name="senha2" type="password" autocomplete="new-password"
                   placeholder="Repita a senha" aria-describedby="senha2-erro" required>
            <button class="toggle-senha" type="button" data-alvo="senha2" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field__error" id="senha2-erro" role="alert"></p>
        </div>

        <button class="btn-gradient" type="submit">Salvar nova senha</button>
      </form>

      <!-- Tela de sucesso: aparece no lugar do formulário -->
      <div id="sucesso" hidden>
        <div class="envelope envelope--ok" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
        </div>
        <h2 class="auth-done" id="sucesso-titulo" tabindex="-1">Senha alterada!</h2>
        <p class="auth-lead">Agora você já pode entrar com a nova senha.</p>
        <div class="test-box" role="note">
          <strong>Modo de teste.</strong> Nada foi salvo: o site ainda não tem banco de dados.
        </div>
        <a class="btn-gradient btn-gradient--link" id="ir-login" href="login.html">Ir para o Log In</a>
      </div>
    </section>

    <a class="auth-back" href="index.html">&larr; Voltar ao início</a>
  </main>

  <script src="js/auth.js"></script>
  <!-- DEV: atalhos de teste. Remover estas 2 linhas (e js/config.js, js/dev-atalhos.js) antes da versão final -->
  <script src="js/config.js"></script>
  <script src="js/dev-atalhos.js"></script>
</body>
</html>
